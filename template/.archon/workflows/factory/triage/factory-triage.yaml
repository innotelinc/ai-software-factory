name: factory-triage
description: |
  Sort ONE issue against MISSION.md and FACTORY_RULES.md and apply the disposition.

  Use when: the dispatcher finds an untriaged issue. Also runnable by hand:
    archon workflow run factory-triage --no-worktree "triage gh:issue:12"
  NOT for: implementing (factory-implement), validating a PR
  (factory-validate), or the scheduled regression (factory-regress).

  ONE ISSUE PER RUN, deliberately. Batching is cheaper and it costs the property
  that matters: a batch that dies halfway leaves some issues labelled and some not,
  with nothing recording which. One issue per run makes every dispatch idempotent
  and every failure isolated, and triage runs on the cheapest model there is.

  THE MODEL CLASSIFIES. IT DOES NOT WRITE STATE. The AI node emits a disposition;
  a script applies it through factory/state.py, which refuses a transition the
  table does not allow. A node that could write the state directly could write a
  state the table forbids, and then the table is decoration.

model: small
mutates_checkout: false

inputs:
  target:
    default: ""
    description: >-
      The issue to triage, as gh:issue:<n>. When empty, it is parsed out of the
      run's trigger message.

returns: apply

nodes:
  # Deterministic parse, before any model sees anything. `$ARGUMENTS` reaches a
  # script as an ENV VAR rather than substituted text, which is the injection guard
  # and also the reason this cannot be an inline bash one-liner.
  - id: resolve
    script: resolve-target
    runtime: uv
    with:
      declared: "$INPUTS.target"
      kind: issue
    output_format:
      type: object
      properties:
        target: { type: string }
        number: { type: string }
      required: [target, number]

  # Flood protection (FACTORY_RULES 1). Runs BEFORE the classifier so a
  # rate-limited issue never costs a model call. Non-owner accounts are capped per
  # UTC day; yesterday's rate-limited issues are unstuck first so the cap is a
  # delay and not a wastebasket.
  - id: flood
    script: flood-check
    runtime: uv
    depends_on: [resolve]
    with:
      target: "$resolve.output.target"
    output_format:
      type: object
      properties:
        rate_limited: { type: boolean }
        reason: { type: string }
      required: [rate_limited, reason]

  - id: context
    script: gather-context
    runtime: uv
    depends_on: [resolve]
    with:
      target: "$resolve.output.target"

  - id: classify
    command: triage
    depends_on: [context, flood]
    when: "$flood.output.rate_limited == false"
    context: fresh
    # No tools at all. Everything it may consider is in the prompt; the inability
    # to look anything else up is what keeps the disposition traceable to the
    # governance files rather than to something it found on the way past.
    allowed_tools: []
    output_format:
      type: object
      properties:
        disposition:
          type: string
          enum: [accepted, deferred, rejected, needs-human]
        priority:
          type: string
          enum: [critical, high, medium, low, ""]
        area: { type: string }
        note: { type: string }
        rules_cited:
          type: array
          items: { type: string }
      required: [disposition, priority, area, note, rules_cited]

  # THE DECISION IS APPLIED BY CODE. state.py refuses an illegal transition, posts
  # the note through the one comment helper, and reads the comment back -- because
  # a verdict the filer cannot read is not a verdict.
  - id: apply
    script: apply-triage
    runtime: uv
    depends_on: [classify, flood]
    trigger_rule: all_done
    with:
      target: "$resolve.output.target"
      rate_limited: "$flood.output.rate_limited"
      flood_reason: "$flood.output.reason"
      decision: { from: "$classify.output", if_skipped: "" }
